services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: onyx
      POSTGRES_PASSWORD: onyx
      POSTGRES_DB: onyx
    ports: ["5432:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 1; done;
      /usr/bin/mc mb -p local/onyx-media || true;
      exit 0;
      "

  backend:
    build: ../backend
    depends_on: [postgres, redis, minio-init]
    ports: ["8080:8080"]
    environment:
      PORT: 8080
      DATABASE_URL: postgres://onyx:onyx@postgres:5432/onyx
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: onyx-media
      OTP_DEV_CODE: "123456"

  admin:
    build: ../admin
    depends_on: [backend]
    ports: ["5173:5173"]
    environment:
      VITE_API: http://localhost:8080

volumes:
  pg:
  minio:
